<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Hi, I'm Xuefeng. Building AI workflows.</title>
<desc id="desc">An original cyan and violet constellation with gently drifting particles. AI and full-stack engineering, developer tools, and interactive products.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081924"/><stop offset=".5" stop-color="#111326"/><stop offset="1" stop-color="#25143E"/></linearGradient>
 <radialGradient id="cyan" cx="0" cy="0" r="1"><stop stop-color="#00C9FF" stop-opacity=".32"/><stop offset="1" stop-color="#00C9FF" stop-opacity="0"/></radialGradient>
 <radialGradient id="violet" cx="1" cy="1" r=".9"><stop stop-color="#9D50FF" stop-opacity=".35"/><stop offset="1" stop-color="#9D50FF" stop-opacity="0"/></radialGradient>
 <linearGradient id="text" x2="1"><stop stop-color="#80E9FF"/><stop offset=".53" stop-color="#A3C8FF"/><stop offset="1" stop-color="#CCA8FF"/></linearGradient>
 <linearGradient id="line"><stop stop-color="#00C9FF" stop-opacity="0"/><stop offset=".32" stop-color="#60D9F4"/><stop offset=".7" stop-color="#A27AFA"/><stop offset="1" stop-color="#9D50FF" stop-opacity="0"/></linearGradient>
 <style>
  .node{animation:shimmer 6s ease-in-out infinite}.particle{animation:drift 12s ease-in-out infinite}.glow{animation:breathe 10s ease-in-out infinite}
  @keyframes shimmer{0%,100%{opacity:.3}50%{opacity:.85}}
  @keyframes drift{0%,100%{transform:translate(0,0);opacity:.3}50%{transform:translate(18px,-8px);opacity:.7}}
  @keyframes breathe{0%,100%{opacity:.7}50%{opacity:1}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important}}
 </style>
</defs>
